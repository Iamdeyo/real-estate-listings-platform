<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="verdantFaviconGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E599" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="verdantFaviconGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="verdantBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
  </defs>

  <!-- Squircle Base for High Contrast on both Light and Dark Browser Themes -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#verdantBgGrad)" stroke="#262626" stroke-width="2" />

  <!-- Subtle Radial Glow Behind Icon -->
  <circle cx="32" cy="32" r="16" fill="#00E599" opacity="0.15" />

  <!-- Left Facet of 'V' Leaf -->
  <path
    d="M 14 15 L 32 49 L 26 49 L 10 23 Z"
    fill="url(#verdantFaviconGrad1)"
  />

  <!-- Right Facet of 'V' Leaf -->
  <path
    d="M 50 15 L 32 49 L 38 49 L 54 23 Z"
    fill="url(#verdantFaviconGrad2)"
  />

  <!-- Central Architectural Apex Diamond -->
  <path
    d="M 32 20 L 39 34 L 32 44 L 25 34 Z"
    fill="#00E599"
    opacity="0.95"
  />
  <path
    d="M 32 20 L 39 34 L 32 44 Z"
    fill="#059669"
    opacity="0.75"
  />
</svg>
